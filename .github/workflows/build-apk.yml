name: Build Nexus APK

on:
  push:
    branches: [ main, master, integrar-ferramentas-flow ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install and align Expo dependencies
        env:
          CI: 'true'
        run: |
          npm install
          npx expo install --fix

      - name: Generate Android project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Build Nexus Release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Nexus APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-APK
          path: android/app/build/outputs/apk/release/app-release.apk
